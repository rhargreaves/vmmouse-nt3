name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint
        run: make docker-lint

      - name: Build and Test
        run: |
          make docker-test
          sudo chown -R "$(id -u):$(id -g)" build/
          cd build
          sha256sum vmmouse-*.iso vmmouse.sys instdrv.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmmouse-artifacts
          path: |
            build/vmmouse*.iso
            build/vmmouse.sys
            build/instdrv.exe
            build/SHA256SUMS.txt
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/vmmouse-*.iso
            build/vmmouse.sys
            build/instdrv.exe
            build/SHA256SUMS.txt
          generate_release_notes: true
